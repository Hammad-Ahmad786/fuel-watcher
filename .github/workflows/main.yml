name: Fuel watcher (hourly)

on:
  schedule:
    - cron: "*/5 * * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LOW_THRESHOLD: ${{ secrets.LOW_THRESHOLD }}
          HIGH_THRESHOLD: ${{ secrets.HIGH_THRESHOLD }}
          WATCH_FUEL: ${{ secrets.WATCH_FUEL }}
          RADIUS_KM: ${{ secrets.RADIUS_KM }}
          EMAIL_ON_ANY_CHANGE: "true"
        run: python watch_fuel_real.py

      - name: Commit state
        run: |
          if [ -f state.json ]; then
            git config user.name "fuel-watcher-bot"
            git config user.email "fuel-watcher-bot@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "Update state"
            git push
          fi
