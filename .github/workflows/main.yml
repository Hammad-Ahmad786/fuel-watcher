name: Fuel watcher (every 5 min)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fuel watcher
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          LOW_THRESHOLD: "2.200"
          HIGH_THRESHOLD: "2.200"
          RADIUS_KM: "5"

          LAT: "50.0173"
          LNG: "8.7870"

          STREET_HINTS: "elisabeth,selbert"
        run: python fuel_monitor.py

      - name: Commit updated state
        run: |
          if [ -f state.json ]; then
            git config user.name "fuel-watcher-bot"
            git config user.email "fuel-watcher-bot@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update diesel price state"
              git push origin HEAD:main
            fi
          fi
