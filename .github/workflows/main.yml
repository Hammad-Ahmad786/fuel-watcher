name: Fuel watcher (every 5 min)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          LOW_THRESHOLD: "1.92"
          HIGH_THRESHOLD: "1.959"

          EMAIL_ON_ANY_CHANGE: "true"

          RADIUS_KM: "5"

        run: python watch_fuel_real.py

      - name: Commit state
        run: |
          if [ -f state.json ]; then

            git config user.name "fuel-watcher-bot"
            git config user.email "fuel-watcher-bot@users.noreply.github.com"

            # Sync latest remote changes
            git fetch origin main
            git reset --hard origin/main

            # Add updated state
            git add state.json

            # Commit only if there are changes
            git diff --cached --quiet || git commit -m "Update state"

            # Push safely
            git push origin main || echo "Push skipped"

          fi
